name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: lint · typecheck · esquemas · tests · build · mutaciones · audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cuaderno
          # Contraseñas desechables de contenedores efímeros de CI; no protegen nada real.
          POSTGRES_PASSWORD: cuaderno_ci
          POSTGRES_DB: cuaderno
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U cuaderno -d cuaderno"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Repo de base (migraciones) y su rol de aplicación.
      PGHOST: 127.0.0.1
      PGPORT: '5435'
      PGUSER: cuaderno
      PGPASSWORD: cuaderno_ci
      CUADERNO_APP_PASSWORD: cuaderno_app_ci
      CUADERNO_DEV_DB: cuaderno
      CUADERNO_TEST_DB: cuaderno_test
      # Backend: solo base y Redis de PRUEBAS, como cuaderno_app.
      TEST_DATABASE_URL: postgresql://cuaderno_app:cuaderno_app_ci@127.0.0.1:5435/cuaderno_test
      TEST_REDIS_URL: redis://127.0.0.1:6381/1
      TZ: UTC
    steps:
      - uses: actions/checkout@v5
      - name: Esquema desde editor-ia-database (main)
        uses: actions/checkout@v5
        with:
          repository: Jonar519/editor-ia-database
          ref: main
          path: editor-ia-database
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editor-ia-database/package-lock.json
      - name: Migrar la base de pruebas y habilitar cuaderno_app
        working-directory: editor-ia-database
        run: |
          npm ci
          node scripts/migrate.mjs test
          node scripts/usuario-app.mjs
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run prisma:check
      - run: npm run openapi:check
      - run: npm test
      - run: npm run build
      - run: npm run mutate
      - run: npm audit --audit-level=high

  gitleaks:
    name: gitleaks (historial completo)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          zricethezav/gitleaks:v8.21.2 git /repo --no-banner --redact -v
