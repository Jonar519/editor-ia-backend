// Contrato entre el API (gateway) y el servicio de IA (ADR 0002, bloque P1). Solo tráfico INTERNO: el
// navegador nunca habla gRPC. Reglas del contrato:
//   - La versión va en el paquete (v1). Un cambio incompatible es v2, en paralelo.
//   - Un número de campo nunca se reutiliza: al quitar un campo, su número y su nombre van a `reserved`.
//     `buf breaking` (npm run proto:check, en el CI) lo comprueba contra main.
//   - El contenido del documento y la instrucción van en campos SEPARADOS. El servicio trata el
//     contenido siempre como datos (entre delimitadores), nunca como instrucciones.
//   - Nada de identidad de la persona más allá de un id opaco: ni correo ni nombre.
//   - Autenticación entre servicios: metadato `authorization: Bearer <IA_SERVICE_TOKEN>`.
//   - El API pone SIEMPRE un deadline (ver ADR 0002).
syntax = "proto3";

package cuaderno.ia.v1;

service Asistente {
  // Unaria: explica un fragmento seleccionado. Respuesta corta y completa.
  rpc Explicar(ExplicarSolicitud) returns (Respuesta);

  // Unaria: vector de una consulta de búsqueda semántica (la búsqueda la hace el API con pgvector).
  rpc EmbeberConsulta(EmbeberConsultaSolicitud) returns (Vector);

  // Streaming del servidor: el texto llega de a poco. El API lo traduce a SSE para el navegador.
  rpc Resumir(TransformarSolicitud) returns (stream Fragmento);
  rpc Mejorar(TransformarSolicitud) returns (stream Fragmento);

  // Streaming del cliente: el API manda los fragmentos de un documento (desde un job de BullMQ) y
  // recibe al final todos sus vectores.
  rpc IndexarDocumento(stream FragmentoDocumento) returns (DocumentoIndexado);

  // Bidireccional: una corriente por conexión de edición. Entra el contexto en cada pausa de escritura y
  // salen sugerencias. Un contexto nuevo con otro `pedido_id` cancela la sugerencia anterior.
  rpc Autocompletar(stream ContextoAutocompletado) returns (stream Sugerencia);

  // Unaria (P2): qué modelo de embeddings usa el servicio y de cuántas dimensiones. El API lo consulta en
  // cada comprobación de salud y antes de buscar o indexar: si no son 1024, la IA queda en "falla" y no
  // se escriben vectores.
  rpc Describir(DescribirSolicitud) returns (Descripcion);
}

// ─── Descripción (P2) ─────────────────────────────────────────────────────────

message DescribirSolicitud {}

message Descripcion {
  // "mock" o "anthropic": el proveedor configurado en el servicio.
  string proveedor = 1;
  // El mismo nombre que se guarda en embeddings.modelo (DocumentoIndexado.modelo).
  string modelo_embeddings = 2;
  uint32 dimensiones = 3;
}

// ─── Comunes ──────────────────────────────────────────────────────────────────

// Quién pide y para qué documento: ids opacos (uuid en texto), para límites y trazas. Nunca datos
// personales. El API ya verificó el acceso ANTES de llamar; el servicio no tiene base ni Redis.
message Origen {
  string cuenta_id = 1;
  // Vacío solo en EmbeberConsulta (la búsqueda es de un espacio, no de un documento).
  string documento_id = 2;
  // Id de la petición del API (el mismo que el campo `solicitud` de los errores), para correlacionar logs.
  string solicitud_id = 3;
  // Espacio del documento (o de la búsqueda): el servicio lo registra con cada llamada para poder auditar
  // el aislamiento entre espacios.
  string espacio_id = 4;
}

// Tokens consumidos, para el tope diario que aplica el API (uso_ia_diario).
message Uso {
  uint32 tokens_entrada = 1;
  uint32 tokens_salida = 2;
}

// ─── Explicar ─────────────────────────────────────────────────────────────────

message ExplicarSolicitud {
  Origen origen = 1;
  // El fragmento seleccionado: DATOS, nunca instrucciones.
  string contenido = 2;
  // Lenguaje del bloque de código, si lo hay ("ts", "sql"…); vacío si es prosa.
  string lenguaje = 3;
}

message Respuesta {
  string texto = 1;
  Uso uso = 2;
}

// ─── Resumir y mejorar ────────────────────────────────────────────────────────

message TransformarSolicitud {
  Origen origen = 1;
  string contenido = 2;
  // Qué hacer con el contenido. Un conjunto cerrado: la persona no escribe instrucciones libres al modelo.
  Estilo estilo = 3;

  enum Estilo {
    ESTILO_SIN_ESPECIFICAR = 0;
    ESTILO_CLARO = 1;     // más claro, mismo largo
    ESTILO_BREVE = 2;     // más corto
    ESTILO_FORMAL = 3;    // tono de documentación formal
  }
}

// Un trozo del texto generado. El último mensaje del stream trae `uso` y `fin = true`.
message Fragmento {
  string texto = 1;
  bool fin = 2;
  Uso uso = 3;
}

// ─── Búsqueda e indexado ──────────────────────────────────────────────────────

message EmbeberConsultaSolicitud {
  Origen origen = 1;
  string consulta = 2;
}

message Vector {
  // EXACTAMENTE 1024 dimensiones (vector(1024) de la base, migración 0011). El servicio rechaza (INTERNAL)
  // un vector de otro tamaño; un modelo real con otra dimensión exige una migración (ADR 0002).
  repeated float valores = 1 [packed = true];
  Uso uso = 2;
}

message FragmentoDocumento {
  // Solo en el primer mensaje del stream.
  Origen origen = 1;
  // Posición del fragmento dentro del documento (0, 1, 2…), para guardar cada vector en su lugar.
  uint32 indice = 2;
  string contenido = 3;
}

message DocumentoIndexado {
  repeated VectorFragmento vectores = 1;
  Uso uso = 2;
  // Modelo que produjo los vectores (se guarda en embeddings.modelo). Al cambiar de modelo hay que
  // reindexar todo: vectores de modelos distintos no se comparan.
  string modelo = 3;

  message VectorFragmento {
    uint32 indice = 1;
    Vector vector = 2;
  }
}

// ─── Autocompletado ───────────────────────────────────────────────────────────

message ContextoAutocompletado {
  // Solo en el primer mensaje de la corriente.
  Origen origen = 1;
  // Id del pedido dentro de la corriente: la sugerencia vuelve con el mismo id. Uno nuevo cancela el anterior.
  uint64 pedido_id = 2;
  // Texto antes y después del cursor (recortado por el API), DATOS.
  string antes = 3;
  string despues = 4;
}

message Sugerencia {
  uint64 pedido_id = 1;
  string texto = 2;
  Uso uso = 3;
}
